<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KEFARM</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <div class="login-container">
        <h2>Login to KEFARM</h2>
        <form id="loginForm">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">

            <button type="submit">Login</button>
        </form>

        <!-- Forgot Password link -->
        <p><a href="forgot_password.php" class="forgot-password-link">Forgot Password?</a></p>

        <!-- Error message container -->
        <p id="login-error" class="error-message"></p>

        <p>Don't have an account? <a href="register.html" class="register-link">Register here</a></p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const loginForm = document.getElementById("loginForm");
            const errorMsg = document.getElementById("login-error");

            loginForm.addEventListener("submit", function (e) {
                e.preventDefault(); // Prevent form from refreshing

                let formData = new FormData(loginForm);

                fetch("login_process.php", {
                    method: "POST",
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        window.location.href = data.redirect; // Redirect to dashboard
                    } else {
                        errorMsg.textContent = data.message; // Show error message
                        errorMsg.style.color = "red";
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    errorMsg.textContent = "Something went wrong. Try again!";
                    errorMsg.style.color = "red";
                });
            });
        });
    </script>
</body>
</html>
